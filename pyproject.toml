[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flora"
version = "0.1.0"
description = "Selected Fable memory-fabric experiment named FloRA"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
kurrent = ["kurrentdbclient>=1.3,<1.4"]
backends = [
    "ladybug==0.21.0",
    "temporalio==1.33.0",
    "kurrentdbclient>=1.3,<1.4",
    "psycopg[binary]>=3.2,<4",
    "nats-py>=2.10,<3",
    "qdrant-client>=1.18,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
