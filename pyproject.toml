[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-demo"
version = "0.1.0"
description = "Auditable memory and longitudinal evaluation infrastructure for the Fable proof"
requires-python = ">=3.11"

[project.scripts]
fable-demo = "fable_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
