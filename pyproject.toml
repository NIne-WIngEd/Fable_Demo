[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-demo"
version = "0.1.0"
description = "Persistent host-scoped experience and memory infrastructure for the Fable demo"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]

[project.scripts]
fable-demo = "fable_demo.cli:main"
fable-runtime = "fable_demo.runtime_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
