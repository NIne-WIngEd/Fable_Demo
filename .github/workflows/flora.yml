name: FloRA selected backend evidence path

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: alice-reference/src:src
    steps:
      - uses: actions/checkout@v4
      - name: Checkout product-neutral A.L.I.C.E. contracts
        uses: actions/checkout@v4
        with:
          repository: NIne-WIngEd/A.L.I.C.E
          ref: 4f287a488bc908bd04f99255ee01b794bacba50b
          path: alice-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install component test dependencies
        run: python -m pip install -e '.[backends,providers,embeddings]'
      - name: Run component contract tests
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            python -m unittest discover -s tests -p "${test_file##*/}" -v
          done

  integration:
    name: integration-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [core, transport, native, lineage, readers, history, history-routes]
    env:
      PYTHONPATH: alice-reference/src:src
      KURRENTDB_URI: kurrentdb://127.0.0.1:2113?tls=false
      XTDB_DSN: postgresql://xtdb@127.0.0.1:5432/xtdb
      TEMPORAL_ADDRESS: 127.0.0.1:7233
    steps:
      - uses: actions/checkout@v4

      - name: Checkout product-neutral A.L.I.C.E. contracts
        uses: actions/checkout@v4
        with:
          repository: NIne-WIngEd/A.L.I.C.E
          ref: 4f287a488bc908bd04f99255ee01b794bacba50b
          path: alice-reference

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version

      - name: Install selected-backend test dependencies
        run: python -m pip install -e '.[backends,providers,embeddings]'

      - name: Start selected services and persistent Temporal
        run: docker compose -f compose.integration.yml up -d

      - name: Wait for selected services
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:2113/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "KurrentDB did not become healthy"
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "XTDB did not become ready"
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if python -c 'import socket; s=socket.create_connection(("127.0.0.1", 4222), timeout=1); s.close()' 2>/dev/null; then
              break
            fi
            [ "$attempt" -lt 90 ] || exit 1
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              break
            fi
            [ "$attempt" -lt 90 ] || exit 1
            sleep 2
          done
          docker compose -f compose.integration.yml ps

      - name: Wait for persistent Temporal and namespace
        run: python scripts/temporal_restart_probe.py health --retry-seconds 120

      - name: Run real selected-backend integration tests
        run: python scripts/run_selected_integration_shard.py --shard '${{ matrix.shard }}'

      - name: Write restart persistence probes
        if: matrix.shard == 'core'
        run: python scripts/backend_restart_probe.py write

      - name: Verify probes before restart
        if: matrix.shard == 'core'
        run: python scripts/backend_restart_probe.py verify --retry-seconds 15

      - name: Checkpoint a persistent Temporal workflow
        if: matrix.shard == 'core'
        run: python scripts/temporal_restart_probe.py write

      - name: Restart selected services
        if: matrix.shard == 'core'
        run: docker compose -f compose.integration.yml restart kurrentdb xtdb nats

      - name: Restart Temporal persistence and server
        if: matrix.shard == 'core'
        run: |
          set -euo pipefail
          docker compose -f compose.integration.yml restart temporal-postgresql
          for attempt in $(seq 1 60); do
            if docker compose -f compose.integration.yml exec -T temporal-postgresql pg_isready -U temporal; then
              break
            fi
            [ "$attempt" -lt 60 ] || exit 1
            sleep 1
          done
          docker compose -f compose.integration.yml restart temporal

      - name: Wait after restart
        if: matrix.shard == 'core'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:2113/health/live >/dev/null; then
              break
            fi
            [ "$attempt" -lt 90 ] || exit 1
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz/ready >/dev/null; then
              break
            fi
            [ "$attempt" -lt 90 ] || exit 1
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if python -c 'import socket; s=socket.create_connection(("127.0.0.1", 4222), timeout=1); s.close()' 2>/dev/null; then
              break
            fi
            [ "$attempt" -lt 90 ] || exit 1
            sleep 2
          done

      - name: Verify persistence after restart
        if: matrix.shard == 'core'
        run: python scripts/backend_restart_probe.py verify --retry-seconds 30 --consume-edge

      - name: Resume persistent Temporal workflow after server and database restart
        if: matrix.shard == 'core'
        run: |
          python scripts/temporal_restart_probe.py health --retry-seconds 120
          python scripts/temporal_restart_probe.py verify

      - name: Capture selected-backend logs
        if: always()
        run: |
          docker compose -f compose.integration.yml ps > selected-backend-ps.txt || true
          docker compose -f compose.integration.yml logs --no-color > selected-backend-logs.txt || true

      - name: Upload backend evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-backend-evidence-${{ matrix.shard }}
          path: |
            selected-backend-ps.txt
            selected-backend-logs.txt

      - name: Tear down selected services
        if: always()
        run: docker compose -f compose.integration.yml down -v
